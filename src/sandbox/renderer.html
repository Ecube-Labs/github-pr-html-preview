<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox Renderer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #runtimeFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }
  </style>
</head>
<body>
  <iframe
    id="runtimeFrame"
    sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"
    referrerpolicy="no-referrer"
  ></iframe>
  <script src="renderer.js"></script>
</body>
</html>
