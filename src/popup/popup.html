<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Pending Preview Banner (shown when side panel mode has pending preview) -->
    <div id="pendingPreviewBanner" class="pending-preview-banner" style="display: none;">
      <div class="pending-preview-info">
        <strong>Preview Ready</strong>
        <span id="pendingPreviewPath" class="pending-preview-path"></span>
      </div>
      <button id="openSidePanelBtn" class="primary open-sidepanel-btn">Open in Side Panel</button>
    </div>

    <h2>GitHub Token Settings</h2>

    <!-- Step 1: Create Token -->
    <div class="step" id="step1">
      <div class="step-header">
        <span class="step-number">1</span>
        <span class="step-title">Create a GitHub Token</span>
        <span class="step-check">✓</span>
      </div>
      <div class="step-content">
        <p class="step-description">Generate a Personal Access Token with <code>repo</code> scope for private repositories.</p>
        <a href="https://github.com/settings/tokens/new?scopes=repo&description=GitHub%20PR%20HTML%20Preview"
           target="_blank" class="btn-link" id="createTokenLink">
          Open GitHub Settings →
        </a>
      </div>
    </div>

    <div class="step-connector"></div>

    <!-- Step 2: Paste & Save -->
    <div class="step" id="step2">
      <div class="step-header">
        <span class="step-number">2</span>
        <span class="step-title">Paste & Save Token</span>
        <span class="step-check">✓</span>
      </div>
      <div class="step-content">
        <div class="input-row">
          <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
          <button id="saveBtn" class="primary">Save</button>
        </div>
        <button id="clearBtn" class="danger clear-btn">Clear Token</button>
      </div>
    </div>

    <div class="step-connector"></div>

    <!-- Step 3: Test Connection -->
    <div class="step" id="step3">
      <div class="step-header">
        <span class="step-number">3</span>
        <span class="step-title">Test Connection</span>
        <span class="step-check">✓</span>
      </div>
      <div class="step-content">
        <button id="testBtn" class="test-btn">Test Connection</button>
        <div id="status"></div>
      </div>
    </div>

    <div class="setting-group">
      <label for="displayMode">Preview Display Mode</label>
      <select id="displayMode">
        <option value="tab">Open in new tab</option>
        <option value="sidepanel">Side Panel (split view)</option>
      </select>
      <p class="setting-description">Side Panel shows preview alongside the PR page</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
