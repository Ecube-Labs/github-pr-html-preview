<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background-color: #f6f8fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background-color: #24292f;
      color: #ffffff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .file-path {
      font-size: 12px;
      color: #8b949e;
      font-weight: 400;
      margin-left: 8px;
      word-break: break-all;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      background-color: #373e47;
      border: 1px solid rgba(205, 217, 229, 0.1);
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .header-btn:hover {
      background-color: #444c56;
    }

    .preview-container {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    .preview-iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
      z-index: 1;
    }

    .loading {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      display: none;
      overflow: hidden;
      background: rgba(9, 105, 218, 0.2);
      z-index: 3;
    }

    .loading-line {
      width: 35%;
      height: 100%;
      background: #0969da;
      box-shadow: 0 0 8px rgba(9, 105, 218, 0.6);
      animation: loading-line-move 1.1s ease-in-out infinite;
    }

    @keyframes loading-line-move {
      0% {
        transform: translateX(-110%);
      }
      50% {
        transform: translateX(105%);
      }
      100% {
        transform: translateX(260%);
      }
    }

    .loading-message {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #cf222e;
      padding: 24px;
      text-align: center;
    }

    .error-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
    }

    .error-message {
      font-size: 14px;
      max-width: 400px;
    }

    .error-details {
      font-size: 12px;
      color: #57606a;
      margin-top: 8px;
      word-break: break-all;
    }

    .error-action {
      margin-top: 16px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      background-color: #0969da;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .error-action:hover {
      background-color: #0860ca;
    }

    .debug-info {
      margin-top: 16px;
      padding: 12px;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      text-align: left;
      max-width: 600px;
      font-size: 12px;
      color: #24292f;
    }

    .debug-info pre {
      margin: 8px 0 0;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      background: #ffffff;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #d0d7de;
    }

    /* Side Panel responsive styles */
    @media (max-width: 500px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 10px 12px;
      }

      .header-title {
        font-size: 13px;
      }

      .file-path {
        font-size: 11px;
        margin-left: 0;
        margin-top: 4px;
        display: block;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .header-btn {
        padding: 4px 10px;
        font-size: 11px;
      }

      .error-message {
        font-size: 13px;
      }

      .error-details {
        font-size: 11px;
      }

      .debug-info {
        font-size: 11px;
        padding: 10px;
      }
    }

    @media (max-width: 350px) {
      .header-title svg {
        display: none;
      }

      .header-btn {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <svg viewBox="0 0 16 16">
        <path d="M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.002-2.253A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z"/>
      </svg>
      HTML Preview
      <span class="file-path" id="filePath"></span>
    </div>
    <div class="header-actions">
      <a id="rawLink" class="header-btn" target="_blank" rel="noopener noreferrer">
        View Raw
      </a>
      <button id="refreshBtn" class="header-btn">
        Refresh
      </button>
    </div>
  </div>

  <div class="preview-container" id="previewContainer">
    <div class="loading" id="loadingState">
      <div class="loading-line"></div>
      <div class="loading-message" id="loadingMessage">Loading preview...</div>
    </div>
  </div>

  <script src="preview.js"></script>
</body>
</html>
